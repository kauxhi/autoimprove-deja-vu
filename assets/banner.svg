<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="autoimprove: Your AI should never make the same mistake twice.">
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="16"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f2f2ee" opacity="0.06"/>
    </pattern>
    <radialGradient id="fade" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0b0d10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0d10" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f2f2ee" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0b0d10"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#fade)"/>

    <!-- wordmark block -->
    <g transform="translate(0 8)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="96" y="132" font-size="14" font-weight="600" letter-spacing="2" fill="#2dd4bf" textLength="196" lengthAdjust="spacingAndGlyphs">CLAUDE CODE SKILL</text>
      <text x="92" y="222" font-size="92" font-weight="600" letter-spacing="-3" fill="#f2f2ee" textLength="540" lengthAdjust="spacingAndGlyphs">autoimprove</text>
      <text x="96" y="272" font-size="22" fill="#8a8f98" textLength="500" lengthAdjust="spacingAndGlyphs">Your AI should never make the same mistake twice.</text>
    </g>

    <!-- chart: weekly repeat mistakes stepping to zero -->
    <g transform="translate(780 22)">
      <line x1="0" y1="96" x2="400" y2="96" stroke="#f2f2ee" stroke-opacity="0.05"/>
      <line x1="0" y1="176" x2="400" y2="176" stroke="#f2f2ee" stroke-opacity="0.05"/>
      <line x1="0" y1="256" x2="400" y2="256" stroke="#f2f2ee" stroke-opacity="0.18"/>
      <rect x="4"   y="104" width="32" height="152" rx="3" fill="url(#bar)"/>
      <rect x="54"  y="138" width="32" height="118" rx="3" fill="url(#bar)"/>
      <rect x="104" y="168" width="32" height="88"  rx="3" fill="url(#bar)"/>
      <rect x="154" y="194" width="32" height="62"  rx="3" fill="url(#bar)"/>
      <rect x="204" y="216" width="32" height="40"  rx="3" fill="url(#bar)"/>
      <rect x="254" y="234" width="32" height="22"  rx="3" fill="url(#bar)"/>
      <rect x="304" y="246" width="32" height="10"  rx="3" fill="url(#bar)"/>
      <circle cx="370" cy="256" r="28" fill="url(#glow)"/>
      <circle cx="370" cy="256" r="6" fill="#2dd4bf"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8a8f98">
        <text x="20"  y="284" text-anchor="middle">W1</text>
        <text x="320" y="284" text-anchor="middle">W7</text>
        <text x="370" y="284" text-anchor="middle" fill="#2dd4bf">now</text>
        <text x="0" y="72" font-size="13" textLength="150" lengthAdjust="spacingAndGlyphs">Déjà Vu Rate → 0</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="16" fill="none" stroke="#1f2430"/>
</svg>
