<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="The autoimprove weekly loop: collect, fingerprint, ledger, score, propose, approve, measure again, then back to collect">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2430"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#0b0d10" stroke="#1f2430"/>
  <rect x="1" y="1" width="1198" height="558" rx="16" fill="url(#dots)" opacity="0.6"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="60" font-size="14" letter-spacing="2" fill="#8a8f98">THE WEEKLY LOOP</text>
    <text x="1140" y="60" font-size="14" text-anchor="end" fill="#8a8f98">one turn = one week</text>

    <!-- cards: top row 1-4 left to right, bottom row 5-7 right to left -->
    <g fill="#11151b" stroke="#1f2430">
      <rect x="60" y="100" width="250" height="130" rx="12"/>
      <rect x="336" y="100" width="250" height="130" rx="12"/>
      <rect x="612" y="100" width="250" height="130" rx="12"/>
      <rect x="888" y="100" width="250" height="130" rx="12"/>
      <rect x="888" y="350" width="250" height="130" rx="12"/>
      <rect x="336" y="350" width="250" height="130" rx="12"/>
    </g>
    <rect x="612" y="350" width="250" height="130" rx="12" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1" fill="#8a8f98">
      <text x="84" y="134">01</text>
      <text x="360" y="134">02</text>
      <text x="636" y="134">03</text>
      <text x="912" y="134">04</text>
      <text x="912" y="384">05</text>
      <text x="636" y="384" fill="#2dd4bf">06  HUMAN GATE</text>
      <text x="360" y="384">07</text>
    </g>

    <g font-size="19" font-weight="600" fill="#f2f2ee">
      <text x="84" y="164">Collect</text>
      <text x="360" y="164">Fingerprint</text>
      <text x="636" y="164">Ledger</text>
      <text x="912" y="164">Score</text>
      <text x="912" y="414">Propose</text>
      <text x="636" y="414">You approve</text>
      <text x="360" y="414">Measure again</text>
    </g>

    <g font-size="15" fill="#8a8f98">
      <text x="84" y="192">a week of local</text>
      <text x="84" y="212">sessions and git</text>
      <text x="360" y="192">every failed</text>
      <text x="360" y="212">tool call</text>
      <text x="636" y="192">mistakes remembered</text>
      <text x="636" y="212">across weeks</text>
      <text x="912" y="192">Déjà Vu Rate and</text>
      <text x="912" y="212">Sync Score</text>
      <text x="912" y="442">lessons, playbooks</text>
      <text x="912" y="462">proposed as diffs</text>
      <text x="636" y="442" fill="#c9cdd3">nothing changes</text>
      <text x="636" y="462" fill="#c9cdd3">without a yes</text>
      <text x="360" y="442">did last week's</text>
      <text x="360" y="462">change work?</text>
    </g>

    <!-- forward arrows -->
    <g stroke="#8a8f98" stroke-width="1.5" fill="none">
      <line x1="313" y1="165" x2="327" y2="165"/>
      <line x1="589" y1="165" x2="603" y2="165"/>
      <line x1="865" y1="165" x2="879" y2="165"/>
      <line x1="1013" y1="233" x2="1013" y2="341"/>
      <line x1="885" y1="415" x2="871" y2="415"/>
    </g>
    <g fill="#8a8f98">
      <path d="M334 165 L325 160 L325 170 z"/>
      <path d="M610 165 L601 160 L601 170 z"/>
      <path d="M886 165 L877 160 L877 170 z"/>
      <path d="M1013 348 L1008 339 L1018 339 z"/>
      <path d="M864 415 L873 410 L873 420 z"/>
    </g>
    <line x1="609" y1="415" x2="595" y2="415" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M588 415 L597 410 L597 420 z" fill="#2dd4bf"/>

    <!-- the two numbers, inside the loop -->
    <g font-size="15">
      <rect x="380" y="270" width="220" height="40" rx="20" fill="#0b0d10" stroke="#1f2430"/>
      <text x="490" y="295" text-anchor="middle" fill="#f2f2ee">Déjà Vu Rate <tspan fill="#2dd4bf">goal 0</tspan></text>
      <rect x="624" y="270" width="220" height="40" rx="20" fill="#0b0d10" stroke="#1f2430"/>
      <text x="734" y="295" text-anchor="middle" fill="#f2f2ee">Sync Score <tspan fill="#8a8f98">0 to 100</tspan></text>
    </g>

    <!-- return path -->
    <path d="M334 415 H215 Q185 415 185 385 V242" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 6"/>
    <path d="M185 233 L180 242 L190 242 z" fill="#2dd4bf"/>
    <text x="200" y="300" font-size="15" fill="#2dd4bf">back to 01</text>
    <text x="200" y="320" font-size="15" fill="#8a8f98">next week</text>

    <text x="600" y="526" font-size="15" text-anchor="middle" fill="#8a8f98">Goal: Déjà Vu Rate reaches zero, no mistake seen twice.</text>
  </g>
</svg>
