e" letter-spacing="0">7</text><text x="380" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#8a8f98" text-anchor="middle" letter-spacing="0">one turn</text><text x="380" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#8a8f98" text-anchor="middle" letter-spacing="0">= one week</text><text x="185.81538868171373" y="310.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#2dd4bf" text-anchor="end" letter-spacing="0">next week</text><text x="113.26513844181704" y="668.729396130826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="0">human gate</text><text x="768" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">1</text><text x="812" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Collect</text><text x="1070" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">read a week of local sessions</text><text x="768" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">2</text><text x="812" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Fingerprint</text><text x="1070" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">strip paths, numbers, ids</text><text x="768" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">3</text><text x="812" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Ledger</text><text x="1070" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">remember across weeks</text><text x="768" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">4</text><text x="812" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Score</text><text x="1070" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">Déjà Vu, Ghosts, Sync</text><text x="768" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">5</text><text x="812" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Propose</text><text x="1070" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">lessons and hooks as diffs</text><rect x="740" y="624" width="800" height="66" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="768" y="670" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#2dd4bf" text-anchor="start" letter-spacing="0">6</text><text x="812" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">You approve</text><text x="1070" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#2dd4bf" text-anchor="start" letter-spacing="0">no yes, no change</text><text x="768" y="744" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#8a8f98" text-anchor="start" letter-spacing="0">7</text><text x="812" y="744" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Measure again</text><text x="1070" y="744" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">did last change work?</text><circle cx="88" cy="851" r="7" fill="#2dd4bf"/><text x="106" y="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8a8f98" text-anchor="start" letter-spacing="0">autoimprove</text><text x="1520" y="860" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="end" letter-spacing="0">Fig. 2</text></svg>
