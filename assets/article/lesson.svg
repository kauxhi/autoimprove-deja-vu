<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="1" y="1" width="1598" height="898" rx="28" fill="#0b0d10" stroke="#1f2430" stroke-width="2"/><text x="80" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="3">LESSON → GHOST → HOOK</text><text x="80" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">One mistake's journey</text><text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">If a lesson does not stick, it becomes a check that cannot be ignored.</text><rect x="80" y="270" width="335" height="220" rx="18" fill="#11151b" stroke="#f97366" stroke-opacity="0.7" stroke-width="2"/><text x="106" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#f97366" text-anchor="start" letter-spacing="0">1 · raw error</text><text x="106" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">mkdir: /app/cache:</text><text x="106" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">operation not</text><text x="106" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">permitted</text><line x1="423" y1="380.0" x2="453.0" y2="380.0" stroke="#8a8f98" stroke-width="3"/><path d="M467,380.0 L453.0,372.3 L453.0,387.7 Z" fill="#8a8f98"/><rect x="475" y="270" width="335" height="220" rx="18" fill="#11151b" stroke="#1f2430" stroke-opacity="1" stroke-width="2"/><text x="501" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">2 · fingerprint</text><text x="501" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">mkdir: <tspan fill="#2dd4bf">&lt;path&gt;</tspan>:</text><text x="501" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">operation not</text><text x="501" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">permitted</text><line x1="818" y1="380.0" x2="848.0" y2="380.0" stroke="#8a8f98" stroke-width="3"/><path d="M862,380.0 L848.0,372.3 L848.0,387.7 Z" fill="#8a8f98"/><rect x="870" y="270" width="335" height="220" rx="18" fill="#11151b" stroke="#1f2430" stroke-opacity="1" stroke-width="2"/><text x="896" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">3 · ledger</text><text x="896" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">fingerprint saved</text><text x="896" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">sessions counted</text><text x="896" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">lesson: none yet</text><line x1="1213" y1="380.0" x2="1243.0" y2="380.0" stroke="#8a8f98" stroke-width="3"/><path d="M1257,380.0 L1243.0,372.3 L1243.0,387.7 Z" fill="#8a8f98"/><rect x="1265" y="270" width="335" height="220" rx="18" fill="#11151b" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="2"/><text x="1291" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#2dd4bf" text-anchor="start" letter-spacing="0">4 · lesson</text><text x="1291" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Use the Write tool</text><text x="1291" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#f2f2ee" text-anchor="start" letter-spacing="0">for protected</text><text x="1291" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#f2f2ee" text-anchor="start" letter-spacing="0">folders.</text><rect x="80" y="560" width="900" height="200" rx="20" fill="#f97366" fill-opacity="0.08" stroke="#f97366" stroke-opacity="0.6" stroke-width="2"/><path d="M125.0,720.0 V652.5 A45.0,45.0 0 0 1 215.0,652.5 V720.0 L200.0,705.0 L185.0,720.0 L170.0,705.0 L155.0,720.0 L140.0,705.0 L125.0,720.0 Z" fill="#f97366" fill-opacity="0.16" stroke="#f97366" stroke-width="4.5" stroke-linejoin="round"/><circle cx="153.5" cy="657.0" r="7.5" fill="#f97366"/><circle cx="186.5" cy="657.0" r="7.5" fill="#f97366"/><text x="250" y="636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Same fingerprint shows up again?</text><text x="250" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#f97366" text-anchor="start" letter-spacing="0">That is a Ghost: the lesson failed.</text><text x="250" y="726" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">Words were not enough.</text><rect x="1080" y="560" width="440" height="200" rx="20" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-width="2"/><text x="1110" y="636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2dd4bf" text-anchor="start" letter-spacing="0">Upgrade to a hook</text><text x="1110" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#f2f2ee" text-anchor="start" letter-spacing="0">a script blocks the</text><text x="1110" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#f2f2ee" text-anchor="start" letter-spacing="0">mistake before it runs</text><line x1="990" y1="660" x2="1050.0" y2="660.0" stroke="#2dd4bf" stroke-width="4"/><path d="M1068,660 L1050.0,650.1 L1050.0,669.9 Z" fill="#2dd4bf"/><path d="M1432.5,496 V530 H530" fill="none" stroke="#f97366" stroke-width="3" stroke-dasharray="8 8"/><path d="M530.0,558.0 L537.7,544.0 L522.3,544.0 Z" fill="#f97366"/><line x1="530" y1="530" x2="530" y2="546" stroke="#f97366" stroke-width="3"/><text x="1412.5" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#f97366" text-anchor="end" letter-spacing="0">comes back next week</text><circle cx="88" cy="851" r="7" fill="#2dd4bf"/><text x="106" y="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8a8f98" text-anchor="start" letter-spacing="0">autoimprove</text><text x="1520" y="860" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" 