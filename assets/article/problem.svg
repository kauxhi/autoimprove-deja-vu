<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="1" y="1" width="1598" height="898" rx="28" fill="#0b0d10" stroke="#1f2430" stroke-width="2"/><text x="80" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="3">THE PROBLEM</text><text x="80" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0">Same mistake, every Monday</text><text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#8a8f98" text-anchor="start" letter-spacing="0">Memory stores facts. Nothing checks that a mistake stays fixed.</text><rect x="1118" y="72" width="402" height="48" rx="24.0" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-opacity="0.5"/><text x="1135.92" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="500" fill="#8a8f98" text-anchor="start" letter-spacing="0">illustration, not data</text><line x1="150" y1="300" x2="150" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="336" y1="300" x2="336" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="522" y1="300" x2="522" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="708" y1="300" x2="708" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="894" y1="300" x2="894" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="1080" y1="300" x2="1080" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="1266" y1="300" x2="1266" y2="700" stroke="#1f2430" stroke-width="2" stroke-dasharray="3 9"/><line x1="1452" y1="300" x2="1452" y2="700" stroke="#1f2430" stroke-width="2" stroke-d